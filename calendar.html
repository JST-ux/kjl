<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>康晉綸的網站 - 我喜歡的影片</title>
    <link rel="stylesheet" href="style.css">
    <style>
        /* 影片容器樣式：確保影片響應式並居中 */
        .video-wrapper {
            max-width: 800px; /* 設定影片最大寬度 */
            margin: 40px auto; /* 居中對齊，並增加上下邊距 */
            padding: 0 10px;
        }

        .video-container {
            position: relative;
            padding-bottom: 56.25%; /* 保持 16:9 比例 (9 / 16 = 0.5625) */
            height: 0;
            overflow: hidden;
            background-color: #000;
            border-radius: 8px; 
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
        }
        
        .video-container iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
        }

        /* 簡單的主體樣式（如果 style.css 不存在） */
        body { font-family: 'Inter', sans-serif; line-height: 1.6; background-color: #f4f4f4; color: #333; }
        header { background-color: #333; color: white; padding: 1em 0; text-align: center; }
        header h1 { margin: 0; }
        nav ul { list-style: none; padding: 0; margin: 0; display: flex; justify-content: center; }
        nav ul li a { color: white; text-decoration: none; padding: 0.5em 1em; display: block; }
        nav ul li a:hover, nav ul li a.active { background-color: #555; border-radius: 4px; }
        main { padding: 20px; max-width: 1200px; margin: auto; }
        footer { text-align: center; padding: 1em 0; background-color: #ccc; position: fixed; bottom: 0; width: 100%; }
        section { background-color: white; padding: 20px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.05); margin-bottom: 20px; }
    </style>
</head>
<body>
    <header>
        <h1>我喜歡的影片</h1>
        <nav>
            <ul>
                <li><a href="index.html">首頁</a></li>
                <li><a href="about me.html">關於康晉綸</a></li>
                <li><a href="files.html">其他同學的作品</a></li>
                <li><a href="calendar.html" class="active">我喜歡的影片</a></li> <!-- 設定為當前頁面 active -->
            </ul>
        </nav>
    </header>

    <main>
        <section>
            <h2>我最喜歡的影片</h2> 
            
            <div class="video-wrapper">
                <div class="video-container">
                    <!-- 使用您提供的 YouTube 嵌入程式碼 -->
                    <iframe 
                        src="https://www.youtube.com/embed/zGhfXXoIbeQ?si=ixAdO2nGcgRZwjbS" 
                        title="YouTube video player" 
                        frameborder="0" 
                        allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" 
                        referrerpolicy="strict-origin-when-cross-origin" 
                        allowfullscreen>
                    </iframe>
                </div>
            </div>

            <p style="text-align: center; margin-top: 30px; color: #555;">
            </p>

        </section>
    </main>

    <footer>
        <p>&copy; 2025 康晉綸的網站</p>
    </footer>
</body>
</html>
